name: fetch-tiles
on:
  push:
    branches: [staging-leaflet]
    paths: [".github/workflows/fetch.yml"]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dl/tiles
          while read t; do [ -z "$t" ] && continue; mkdir -p "dl/tiles/$(dirname $t)"
            curl -fsSL -A "iryba.cz screenshot preview (pstruhakapr@gmail.com)" "https://tile.openstreetmap.org/$t.png" -o "dl/tiles/$t.png" || echo "fail $t"; sleep 0.3; done < dl/tiles-need.txt
          find dl/tiles -name '*.png' | wc -l
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add dl && git commit -m "osm tiles for previews" && git push
