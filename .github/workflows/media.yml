name: media
on:
  push:
    branches: [media-job]
    paths: ["media/**", ".github/workflows/media.yml"]
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y >/dev/null && npm i playwright@1 && npx playwright install --with-deps chromium
      - run: mkdir -p out/vid && node media/shots.mjs
      - run: node media/video.mjs
      - name: commit
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add out && git commit -m "media výstup" && git push
