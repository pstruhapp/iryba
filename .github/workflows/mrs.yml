name: fetch-mrs
on:
  push:
    branches: [staging-mrs]
    paths: [".github/workflows/mrs.yml"]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -x
          mkdir -p mrs && cd mrs
          UA="Mozilla/5.0 (iryba.cz data check; pstruhakapr@gmail.com)"
          for p in reviry predpisy spolky kontakty pro-rybare ""; do curl -sSL -A "$UA" "https://mrsbrno.cz/$p" -o "page-${p:-home}.html" || true; done
          grep -oE '(src|href)="[^"]+\.(js|json)[^"]*"' page-reviry.html | sed -E 's/^(src|href)="//; s/"$//' | sort -u > assets.txt || true
          cat assets.txt
          i=0; while read a; do i=$((i+1)); case "$a" in http*) u="$a";; //*) u="https:$a";; /*) u="https://mrsbrno.cz$a";; *) u="https://mrsbrno.cz/$a";; esac; curl -sSL -A "$UA" "$u" -o "asset-$i.$(echo $a | grep -oE '\.(js|json)' | head -1 | tr -d .)" || true; echo "$i $u" >> assets-map.txt; done < assets.txt
          grep -ohE "(fetch|ajax|getJSON|axios\.get|url)\s*[:(]\s*['\"][^'\"]+['\"]" page-reviry.html asset-* 2>/dev/null | sort -u > endpoints.txt || true
          grep -ohE "['\"](/[a-z0-9_/.-]*(api|json|revir|ajax)[a-z0-9_/.?=&-]*)['\"]" page-reviry.html asset-* 2>/dev/null | sort -u >> endpoints.txt || true
          cat endpoints.txt
          ls -la
      - run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add mrs && git commit -m "mrs fetch" && git push
