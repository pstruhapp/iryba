name: fetch-mrs
on:
  push:
    branches: [staging-mrs]
    paths: [".github/workflows/mrs.yml"]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p mrs2 && cd mrs2
          UA="Mozilla/5.0 (iryba.cz data check; pstruhakapr@gmail.com)"
          curl -sSL -A "$UA" https://mrsbrno.cz/appsettings.json -o appsettings.json; cat appsettings.json
          for a in Territories-B_DUTAep.js TerritoryDetail-C-XH_kkB.js Associations-CORXiTDM.js AssociationDetail-k8gWoIOK.js Regulations-BkIkOzj1.js; do curl -sSL -A "$UA" "https://mrsbrno.cz/assets/$a" -o "$a"; done
          grep -ohE '`[^`]{0,80}`|"/[A-Za-z0-9/_-]{3,80}"' Territor*.js Assoc*.js | sort -u > strings.txt; cat strings.txt | head -80
          ls -la
      - run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add mrs2 && git commit -m "mrs fetch 2" && git push
