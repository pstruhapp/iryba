name: fetch-mrs
on:
  push:
    branches: [staging-mrs]
    paths: [".github/workflows/mrs.yml", "tools/**"]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/docs.sh
      - run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add mrs4 && git commit -q -m "mrs docs" && git push
