<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Na výlet</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Na výlet">
<meta name="theme-color" content="#2E7D4F">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#2E7D4F;color:#F4F1E8;font:17px/1.4 system-ui,-apple-system,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
img{width:96px;height:96px;border-radius:22px}
.info{background:rgba(0,0,0,.18);border-radius:16px;padding:12px 16px;max-width:340px;width:100%;box-sizing:border-box;font-size:16px}
.info div{margin:2px 0}
a{display:inline-block;background:#F4F1E8;color:#1F5E3A;font-weight:700;font-size:20px;padding:16px 30px;border-radius:16px;text-decoration:none}
p{max-width:330px;opacity:.85;font-size:14px;margin:0}
</style>
</head>
<body>
<img src="icon-192.png" alt="">
<div class="info"><div id="misto">📍 Zjišťuji polohu…</div></div>
<a id="go" href="https://claude.ai/artifact/6CPijs8JcD4xfFzgPqbHp9">Otevřít Na výlet</a>
<p id="tip">Poloha se při otevření zkopíruje. Pokud ji chceš v aplikaci, otevři tam „Místo“ a klepni na Vložit polohu.</p>
<script>
let misto="";
const go=document.getElementById("go");
function txt(){ return misto ? `Poloha: ${misto}` : ""; }
go.addEventListener("click",ev=>{
  const t=txt(); if(!t) return;
  ev.preventDefault();
  const done=()=>location.href=go.href;
  try{ navigator.clipboard.writeText(t).then(done,done); }catch(e){ done(); }
});
if(navigator.geolocation) navigator.geolocation.getCurrentPosition(async pos=>{
  const lat=pos.coords.latitude, lon=pos.coords.longitude, gps=`GPS ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
  misto=gps; document.getElementById("misto").textContent="📍 "+gps;
  const nazev=fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=cs&lat=${lat}&lon=${lon}`).then(r=>r.json()).then(j=>{
    const a=j.address||{}, obec=a.village||a.town||a.city||a.hamlet||a.municipality||a.suburb||"", okr=a.county||a.state_district||"";
    const n=[obec,okr].filter(Boolean).join(", ");
    if(n){ misto=`${n} (${gps})`; document.getElementById("misto").textContent="📍 "+n; }
  }).catch(()=>{});
  await nazev;
},()=>{ document.getElementById("misto").textContent="📍 poloha nepovolena"; },{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
else document.getElementById("misto").textContent="📍 poloha není k dispozici";
</script>
</body>
</html>
